<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height, Width , boreders & backgroung-CSS</title>
    <style>
        #firstpara{
            background-color: aqua;
            height: 100px;
            width: 455px;
            border: 4px solid blueviolet;
            /* border-width: 4px;
            border-style: solid;
            border-color: blueviolet; */
            border-radius:11px;
        }
        #secpara{
            background-color: bisque;
            height: 100px;
            width: 455px;
            border-top: 4px solid brown;
            border-bottom: 4px solid rgb(14, 16, 120);
            border-left: 4px solid rgb(165, 136, 42);
            border-right: 4px solid blueviolet;
            border-top-left-radius: 4px;
            border-top-right-radius: 14px;
            border-bottom-left-radius: 8px ;
            border-bottom-right-radius: 24px;
        }
        #thirdpara{
            height: 500px;
            width: 455px;
            background-image: url('product.png');
            border: 4px solid red;
            background-repeat: no-repeat;/*repeat-x & repeat-y will make it repeat on x & y axis*/
            background-position: center center;
            /* background-position: top center;
            background-position: bottom right; */
            /* background-position: 192px 34px; */
        }
    </style>
</head>
<body>
    <h1>This is Heading</h1>
    <p id="firstpara">This is paragraph</p>

    <h1>This is second Heading</h1>
    <p id="secpara">This is my second paragraph</p>

    <h1>This is third Heading</h1>
    <p id="thirdpara">This is my third paragraph</p>
</body>
</html>
