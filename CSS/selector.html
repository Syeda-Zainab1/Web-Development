<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector-css</title>
    <style>
        /*Element selector */
        p{
            border: 2px solid red;
        }
        /* Id selector */
        #firstpara{
            color: red;
        }
        /* Class selector */
        .bgblue{
            background-color: blue;
            color: aqua;
        }
        /* Grouping selector */
        footer,span{
            background-color: pink;
        }
    </style>
</head>
<body>
    <h3>CSS Selectors</h3>
    <p id="firstpara">This is a simple paragraph to demonstrate css selectors.</p>
    <p class="redElement bgblue" id="secpara">This is another simple paragraph to demonstrate css selectors.</p>
    <div>
        <p>This is yet another simple paragraph inside div to demonstrate css selectors.</p>
        <span>This is span</span>
    </div>
    <footer>This is footer</footer>
</body>
</html>
