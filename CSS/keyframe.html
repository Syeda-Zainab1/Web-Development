<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyframe & Animation-CSS</title>
    <style>
        .container{
            background-color: blue;
        }
        .box{
            background-color: aqua;
            height: 250px;
            width: 250px;
            position: relative;
            animation-name: zainab1;
            animation-name: zainab2;
            animation-duration: 1s;
            animation-iteration-count: 30;
            /* animation-fill-mode: alternate;
            animation-timing-function: ease-in; 
            animation-delay: 3s;
            animation-direction: reverse; 
            animation :animation-name animation-duration animation-timing-function animation-delay animation-iteration-count animation-fill-mode;
            */
        }
        @keyframes zainab2 {
            0%{
                top: 0px;
                left: 0px;
            }
            25%{
                top: 250px;
                left: 0px;
            }
            75%{
                top: 250px;
                left: 250px;
            }
            100%{
                top: 0px;
                left: 250px;
            }
        }
        @keyframes zainab1 {
            from{
                width: 200px;
            }
            to{
                width: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            This is box
        </div>
    </div>
</body>
</html>
