<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tag</title>
</head>
<body>
   <!-- semantic tags can benefit both your website's SEO and the maintainability of your code. -->
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header> 
    <main>
        <h1>What are the Semantic Tags?</h1>
        <!-- Html5 Features -->
         <!--
        Semantic Tags: <header>, <nav>, <article>, <section>, <footer> for better SEO and accessibility.
        Native Media: Built-in <audio> and <video> without plugins.
        Graphics: Native 2D/3D visuals via <canvas> and <svg>.
        Local Storage: localStorage and sessionStorage replace heavy reliance on cookies.
        Enhanced Forms: Inputs for email, date, color, plus built-in required validation.
        APIs: Native support for Geolocation, WebSockets (real-time data), and Web Workers (background scripts). -->
    </main>
    <footer>
        Copyright SZM | All right reserved  
    </footer>
</body>
</html>
