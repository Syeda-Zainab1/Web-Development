<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <table border="">
        <caption>My Marksheet</caption>
        <colgroup>
        <col  span="2" style="background-color: aquamarine;">
        <col  style="background-color: brown;">
        </colgroup>
        <thead style="background-color: coral;">
            <tr>
            <th>Subject</th>
            <th>Marks</th>
            <th>Passed</th>
        </tr>
        </thead>
        <tbody>
            <tr>
            <td>Math</td>
            <td>99</td>
            <td>Yes</td>
        </tr>
        <tr>
            <td>Urdu</td>
            <td>39</td>
            <td>No</td>
        </tr>
        <tr>
            <td>English</td>
            <td>89</td>
            <td>Yes</td>
        </tr>
        </tbody>
        <tfoot style="background-color: palevioletred;">
           <tr>
               <td colspan="2">Passed</td>
               <td>Yes</td>
           </tr>
        </tfoot>
    </table>
</body>
</html>
